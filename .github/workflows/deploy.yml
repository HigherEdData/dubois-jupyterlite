name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mamba
        uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: '1.5.8-0'
          environment-file: .github/build-environment.yml
          cache-environment: true

      - name: Build the JupyterLite site
        shell: bash -l {0}
        run: |
          cp README.md content
          jupyter lite build --contents content --output-dir dist
          python - <<'PY'
          from pathlib import Path

          tree_index = Path("dist/tree/index.html")
          html = tree_index.read_text()
          if "<body" not in html:
              closing = "  </head>\n</html>\n"
              replacement = """  </head>
          <body class="jp-ThemedContainer" data-notebook="tree">
            <div id="jupyterlite-loading-indicator" class="hidden">
              <div class="jupyterlite-loading-indicator-spinner"></div>
              <div class="jupyterlite-loading-indicator-text">Loading JupyterLite...</div>
            </div>
            <noscript>
              <div style="text-align: center; padding: 20px;">
                  JupyterLite requires JavaScript to be enabled in your browser.
              </div>
            </noscript>
          </body>
          </html>
          """
              html = html.replace(closing, replacement)
              tree_index.write_text(html)
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
